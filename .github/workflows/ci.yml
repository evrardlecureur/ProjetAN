name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

  # Runs the simulations (four solvers, Yellowstone scenario, convergence
  # study), publishes the empirical orders and uploads the regenerated figures.
  pipeline:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: code

    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Run the simulations
        run: python main.py | tee simulation.log

      - name: Publish the empirical orders of convergence
        run: |
          {
            echo "## Empirical orders of convergence"
            echo
            echo '```text'
            cat simulation.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the figures
        uses: actions/upload-artifact@v7
        with:
          name: figures
          path: code/*.png

  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v4

      - name: Compile the report
        run: tectonic -X compile Rapport.tex

      - name: Upload the PDF
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: Rapport.pdf

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Markdown with markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      # Offline mode checks the links to repository files, the heading anchors
      # and the images without depending on the availability of external sites.
      - name: Check links, anchors and images with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress .
          jobSummary: true
