name: Bug report
description: Report a wrong result, a script or report that no longer builds, or a problem in the documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please do not report security vulnerabilities here: follow the [security policy](https://github.com/evrardlecureur/ProjetAN/blob/main/SECURITY.md) instead.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - "Model and parameters (code/model.py, code/params.py)"
        - "Solvers (code/solvers.py)"
        - "Simulations and figures (code/main.py)"
        - "Report or slides (Rapport.tex, docs/)"
        - "CI / GitHub Actions"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran, from a fresh clone if possible.
      placeholder: |
        pip install -r requirements.txt
        cd code
        python main.py
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output and traceback
      description: Paste the relevant output. It is formatted as code automatically.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and tool versions.
      placeholder: "Windows 11, Python 3.12.10, numpy 2.5.3, matplotlib 3.11.2"
